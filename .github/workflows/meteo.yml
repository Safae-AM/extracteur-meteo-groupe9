name: Automatisation Météo

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  run-meteo:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v3
        with:
          ref: Version-2-script-de-base  

      - name: Donner les droits d'exécution
        run: chmod +x Extracteur_meteo.sh

      - name: Exécuter le script météo
        run: ./Extracteur_meteo.sh
